<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>炒饭智能 · 设置</title>
<style>
  :root{color-scheme:light dark;--ink:#22354a;--muted:#718095;--line:#dfe6ee;--blue:#2669b4;--bg:#fff}
  @media (prefers-color-scheme:dark){
    :root{--ink:#e6edf5;--muted:#93a3b8;--line:#2b3644;--blue:#6aa9ef;--bg:#151b23}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:22px 20px 28px;background:var(--bg);color:var(--ink);
       font:14px/1.8 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{margin:0 0 4px;font-size:16px;font-weight:650;letter-spacing:.01em}
  .hint{margin:0 0 20px;color:var(--muted);font-size:12px}
  .field{margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
  .desc{color:var(--muted);font-size:12px;margin:5px 0 0}
  input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--line);
      border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
  .pair{display:flex;gap:8px;align-items:center}
  .pair select{width:auto;min-width:96px;flex:0 0 auto}
  .pair .dash{color:var(--muted);font-size:13px}
  .pair select:disabled{opacity:.45}
  .row{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;
      padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  button.primary{border-color:var(--blue);color:var(--blue);font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  #status{font-size:12px;color:var(--muted);min-height:1.6em}
  #status.bad{color:#c1443c}
  #status.ok{color:#2f7d4f}
  .skeleton{height:44px;border-radius:7px;background:color-mix(in srgb,var(--line) 55%,transparent);
      margin-bottom:14px}
</style>
</head>
<body>
<h1>炒饭智能</h1>
<p class="hint">保存后由宿主重载插件生效；她自己的节拍（mind_pace）不会被这里覆盖。</p>

<div id="form" aria-busy="true">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<div class="row">
  <button id="save" class="primary" disabled>保存</button>
  <button id="reload" disabled>重新读取</button>
  <span id="status" role="status" aria-live="polite">正在读取配置…</span>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('form');
  var saveBtn = document.getElementById('save');
  var reloadBtn = document.getElementById('reload');
  var statusEl = document.getElementById('status');

  var revision = null;      // 权威版本号：只来自宿主回执
  var fields = [];          // 最新一次读取到的字段声明
  var inputs = [];          // {path, el, original, field, read?}
  var busy = false;

  // 安静时段：一栏两个时间下拉（开始 / 结束），存成 HH:MM-HH:MM。
  var QUIET_FIELD = 'quietHours';
  var STEP_MIN = 15;

  function say(text, tone) {
    statusEl.textContent = text;
    statusEl.className = tone || '';
  }

  function pathKey(path) { return path.join('\u0001'); }

  function isPrivate(field) {
    return field.format === 'password' || field.writeOnly === true;
  }

  function isQuiet(field) {
    return field.path.length === 1 && field.path[0] === QUIET_FIELD;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(minutes) { return pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60); }

  function minutesOf(text) {
    var hit = /^(\d{1,2}):(\d{2})$/.exec(String(text == null ? '' : text).trim());
    if (!hit) return null;
    var hour = Number(hit[1]), minute = Number(hit[2]);
    if (!isFinite(hour) || !isFinite(minute) || hour > 23 || minute > 59) return null;
    return hour * 60 + minute;
  }

  function parseQuiet(value) {
    var parts = String(value == null ? '' : value).trim().split('-');
    if (parts.length !== 2) return { start: null, end: null };
    var start = minutesOf(parts[0]), end = minutesOf(parts[1]);
    if (start === null || end === null || start === end) return { start: null, end: null };
    return { start: start, end: end };
  }

  function quietText(parsed) {
    return parsed.start === null ? '' : hhmm(parsed.start) + '-' + hhmm(parsed.end);
  }

  function timeOptions(selected) {
    var values = [];
    for (var minute = 0; minute < 24 * 60; minute += STEP_MIN) values.push(minute);
    if (selected !== null && values.indexOf(selected) < 0) {
      values.push(selected);                       // 盘上是 01:07 这种不整齐的值也照原样显示
      values.sort(function (a, b) { return a - b; });
    }
    var out = '';
    for (var i = 0; i < values.length; i += 1) {
      var text = hhmm(values[i]);
      out += '<option value="' + text + '"' +
             (selected !== null && values[i] === selected ? ' selected' : '') +
             '>' + text + '</option>';
    }
    return out;
  }

  function num(el) {
    var v = el.value.trim();
    if (v === '') return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }

  function readValue(field, el) {
    if (field.type === 'boolean') return el.checked;
    if (field.type === 'number' || field.type === 'integer') {
      var n = num(el);
      return n === null ? null : (field.type === 'integer' ? Math.round(n) : n);
    }
    return el.value;
  }

  function buildQuiet(field, id) {
    var parsed = parseQuiet(field.value);
    var box = document.createElement('div');
    box.className = 'pair';

    var start = document.createElement('select');
    start.id = id + '-start';
    start.setAttribute('aria-label', '安静时段开始');
    start.innerHTML = '<option value="">（不设）</option>' + timeOptions(parsed.start);

    var dash = document.createElement('span');
    dash.className = 'dash';
    dash.textContent = '—';

    var end = document.createElement('select');
    end.id = id + '-end';
    end.setAttribute('aria-label', '安静时段结束');
    end.innerHTML = timeOptions(parsed.end === null ? 7 * 60 : parsed.end);

    var hint = document.createElement('p');
    hint.className = 'desc';

    function sync() {
      var off = start.value === '';
      end.disabled = off;
      if (off) {
        hint.textContent = '不设：她任何时间都可能醒。';
        return;
      }
      if (start.value === end.value) {
        hint.textContent = '起止相同 ＝ 不设，保存后不限制时间。';
        return;
      }
      hint.textContent = '安静时段 ' + start.value + ' – ' + end.value +
                        (start.value > end.value ? '（跨零点）' : '') + '。';
    }

    start.addEventListener('change', function () { sync(); refresh(); });
    end.addEventListener('change', function () { sync(); refresh(); });
    sync();

    box.appendChild(start);
    box.appendChild(dash);
    box.appendChild(end);

    return {
      box: box,
      hint: hint,
      el: start,
      original: quietText(parsed),
      read: function () {
        if (start.value === '' || start.value === end.value) return '';
        return start.value + '-' + end.value;
      }
    };
  }

  function build(state) {
    var incoming = Array.isArray(state.fields) ? state.fields : [];
    var outer = document.createElement('div');
    inputs = [];

    incoming.forEach(function (field) {
      if (!field || !Array.isArray(field.path) || !field.path.length) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';

      var label = document.createElement('label');
      label.textContent = field.title || field.path[field.path.length - 1];
      var id = 'f-' + field.path.join('-').replace(/[^A-Za-z0-9_-]/g, '_');
      label.setAttribute('for', id);

      if (isQuiet(field)) {
        var pair = buildQuiet(field, id);
        wrap.appendChild(label);
        wrap.appendChild(pair.box);
        wrap.appendChild(pair.hint);
        outer.appendChild(wrap);
        inputs.push({path: field.path, el: pair.el, original: pair.original,
                     field: field, read: pair.read});
        return;
      }

      var el;
      if (field.type === 'boolean') {
        el = document.createElement('input');
        el.type = 'checkbox';
        el.checked = field.value === true;
      } else {
        el = document.createElement('input');
        el.type = (field.type === 'number' || field.type === 'integer') ? 'number' : 'text';
        if (el.type === 'number') {
          if (typeof field.minimum === 'number') el.min = field.minimum;
          if (typeof field.maximum === 'number') el.max = field.maximum;
          el.step = field.type === 'integer' ? '1' : 'any';
        }
        if (isPrivate(field)) {
          el.type = 'password';
          el.autocomplete = 'new-password';
          el.placeholder = '留空表示保留原值';
          el.value = '';
        } else {
          el.value = (field.value === undefined || field.value === null) ? '' : String(field.value);
        }
      }
      el.id = id;
      if (field.description) el.title = field.description;

      wrap.appendChild(label);
      wrap.appendChild(el);
      if (field.description) {
        var desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = field.description;
        wrap.appendChild(desc);
      }
      outer.appendChild(wrap);

      if (el.type !== 'checkbox') el.addEventListener('input', refresh);
      else el.addEventListener('change', refresh);

      inputs.push({path: field.path, el: el, original: el.value, field: field});
    });

    form.textContent = '';
    form.appendChild(outer);
    form.setAttribute('aria-busy', 'false');
    fields = incoming;
  }

  function changes() {
    var out = [];
    inputs.forEach(function (item) {
      var f = item.field;
      if (item.read) {                              // 安静时段：两个下拉合成一句
        var composed = item.read();
        if (composed !== item.original) out.push({path: item.path, value: composed});
        return;
      }
      if (isPrivate(f)) {
        if (item.el.value === '') return;           // 空 = 保留原值
        out.push({path: item.path, value: item.el.value});
        return;
      }
      if (f.type === 'boolean') {
        if (item.el.checked !== (f.value === true)) out.push({path: item.path, value: item.el.checked});
        return;
      }
      if (item.el.value === item.original) return;
      out.push({path: item.path, value: readValue(f, item.el)});
    });
    return out;
  }

  function refresh() {
    var dirty = changes().length > 0;
    saveBtn.disabled = busy || revision === null || !dirty;
    statusEl.textContent = dirty ? '有未保存的改动' : statusEl.textContent;
  }

  function ask() {
    say('正在读取配置…');
    parent.postMessage({type: 'telyincore:config:get'}, '*');
  }

  function onState(state) {
    if (state.ok === false) {
      form.setAttribute('aria-busy', 'false');
      say('读取失败：' + (state.error || '宿主没有给原因'), 'bad');
      return;
    }
    revision = state.revision === undefined ? null : state.revision;
    build(state);
    reloadBtn.disabled = revision === null;
    saveBtn.disabled = true;
    say(revision === null ? '没拿到版本号，只能看不能存' : '已读取', revision === null ? 'bad' : '');
  }

  saveBtn.addEventListener('click', function () {
    if (busy) return;
    var pending = changes();
    if (!pending.length || revision === null) return;
    busy = true;
    saveBtn.disabled = true;
    reloadBtn.disabled = true;
    say('正在保存…');
    parent.postMessage({
      type: 'telyincore:config:save',
      revision: revision,
      changes: pending
    }, '*');
  });

  reloadBtn.addEventListener('click', function () {
    if (busy) return;
    ask();
  });

  window.addEventListener('message', function (event) {
    if (event.source !== parent) return;          // 只认宿主这一路
    var msg = event.data;
    if (!msg || typeof msg !== 'object') return;

    if (msg.type === 'telyincore:config:state') {
      busy = false;
      onState(msg);
      return;
    }
    if (msg.type === 'telyincore:config:saved') {
      busy = false;
      reloadBtn.disabled = false;
      if (msg.ok === false) {
        say('没保存上：' + (msg.error || '宿主没有给原因'), 'bad');
        saveBtn.disabled = false;
        return;
      }
      say('已保存，重新读取确认…', 'ok');
      ask();                                      // 成功后重新 get，拿新 revision
    }
  });

  ask();
})();
</script>
</body>
</html>
